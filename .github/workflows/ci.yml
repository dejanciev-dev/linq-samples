name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore LinqSamples.slnx

      - name: Build
        run: dotnet build LinqSamples.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test LinqSamples.slnx --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Run samples
        run: dotnet run --project src/LinqSamples.App --no-build --configuration Release
